name: Post-release Final Gate

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: post-release-final-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Final automation gate
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'chore/post-release-sync-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for checks and inspect feedback
        uses: actions/github-script@v7
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const gate = require('./.github/scripts/pr-final-gate.cjs');
            return gate({ github, context, core });
