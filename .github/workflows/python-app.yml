name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package version is synced
        run: python scripts/version_sync.py check
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r dashboard/backend/requirements.txt
          pip install flake8 pip-audit
      - name: Audit Python packages
        run: |
          pip-audit -r requirements.txt -r dashboard/backend/requirements.txt
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: >-
          pytest tests/ -v
          --ignore=tests/integration/test_postgresql_storage.py

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: markethelm
          POSTGRES_USER: markethelm
          POSTGRES_PASSWORD: markethelm-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markethelm -d markethelm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] "psycopg[binary]>=3.2.0"
      - name: Test PostgreSQL storage
        env:
          MARKET_HELM_POSTGRES_TEST_URL: postgresql://markethelm:markethelm-test@localhost:5432/markethelm
        run: pytest tests/integration/test_postgresql_storage.py -v

  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Test CI automation scripts
        run: node --test .github/scripts/*.test.cjs

      - name: Install locked dashboard dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Audit dashboard dependencies
        working-directory: dashboard/frontend
        run: node ../../.github/scripts/npm-audit-ci.cjs

      - name: Build and test dashboard
        working-directory: dashboard/frontend
        run: |
          npm run format:check
          npm run build
          npm test

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-npm-logs
          path: ~/.npm/_logs/*-debug-0.log
          if-no-files-found: ignore
          retention-days: 7
