name: Daily MarketHelm

permissions:
  actions: read
  contents: read

on:
  schedule:
    # 22:30 UTC is safely after the regular XNYS close throughout the year.
    - cron: '30 22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: projection-evidence-collection
  cancel-in-progress: false

jobs:
  run-daily-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Require a completed XNYS session
        id: collection-day
        shell: bash
        run: echo "run=$(python scripts/projection_collection_day.py)" >> "$GITHUB_OUTPUT"

      - name: Find latest projection evidence archive
        if: steps.collection-day.outputs.run == 'true'
        id: previous-archive
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'schedule.yml',
                status: 'success',
                per_page: 100,
              },
            );
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              const archive = artifacts.find(
                (artifact) =>
                  artifact.name === 'projection-forward-archive' &&
                  !artifact.expired,
              );
              if (archive) {
                core.info(`Restoring archive from workflow run ${run.id}`);
                core.setOutput('run-id', String(run.id));
                return;
              }
            }
            core.info('No previous projection evidence archive is available.');

      - name: Restore projection evidence archive
        if: >-
          steps.collection-day.outputs.run == 'true' &&
          steps.previous-archive.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: projection-forward-archive
          path: data
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-archive.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Run market-helm
        if: steps.collection-day.outputs.run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: market-helm

      - name: Assess cumulative projection evidence
        if: steps.collection-day.outputs.run == 'true'
        id: assessment
        shell: bash
        run: |
          set +e
          python scripts/projection_baseline.py assess \
            --data-dir data \
            --days 365 > data/projection-assessment.json
          status=$?
          set -e
          cat data/projection-assessment.json
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 0 ]; then
            echo "qualified=true" >> "$GITHUB_OUTPUT"
          else
            echo "qualified=false" >> "$GITHUB_OUTPUT"
            echo "Evidence is still accumulating; qualification is not expected yet."
          fi

      - name: Capture qualified observed baseline
        if: >-
          steps.collection-day.outputs.run == 'true' &&
          steps.assessment.outputs.qualified == 'true'
        run: |
          python scripts/projection_baseline.py capture \
            --data-dir data \
            --days 365 \
            --output-dir observed-baseline

      - name: Preserve cumulative projection evidence
        if: steps.collection-day.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: projection-forward-archive
          path: |
            data/daily_data_*.csv
            data/projections_*.csv
            data/projection-assessment.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve qualified observed baseline
        if: >-
          steps.collection-day.outputs.run == 'true' &&
          steps.assessment.outputs.qualified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: projection-observed-baseline-${{ github.run_id }}
          path: observed-baseline/
          if-no-files-found: error
          retention-days: 90
