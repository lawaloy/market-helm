name: Dependency Audit

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Show Node.js toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dashboard dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Audit dashboard dependencies
        working-directory: dashboard/frontend
        run: node ../../.github/scripts/npm-audit-ci.cjs

      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-npm-logs
          path: ~/.npm/_logs/*-debug-0.log
          if-no-files-found: ignore
          retention-days: 7
