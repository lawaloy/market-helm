services:
  postgres:
    image: ${MARKETHELM_POSTGRES_IMAGE:-${MARKET_HELM_POSTGRES_IMAGE:-postgres:16-alpine}}
    restart: unless-stopped
    environment:
      POSTGRES_DB: markethelm
      POSTGRES_USER: markethelm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markethelm -d markethelm']
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_BASE_IMAGE: ${MARKETHELM_NODE_BASE_IMAGE:-${MARKET_HELM_NODE_BASE_IMAGE:-node:22.23.2-alpine}}
        PYTHON_BASE_IMAGE: ${MARKETHELM_PYTHON_BASE_IMAGE:-${MARKET_HELM_PYTHON_BASE_IMAGE:-python:3.12-slim}}
    restart: unless-stopped
    env_file: ${MARKETHELM_ENV_FILE:-${MARKET_HELM_ENV_FILE:-.env.staging}}
    environment:
      MARKETHELM_DATABASE_URL: postgresql://markethelm:${POSTGRES_PASSWORD}@postgres:5432/markethelm
      DATA_DIR: /var/lib/markethelm/data
    ports: ['127.0.0.1:${MARKETHELM_PORT:-${MARKET_HELM_PORT:-8000}}:8000']
    volumes: [market-data:/var/lib/markethelm/data]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
  worker:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_BASE_IMAGE: ${MARKETHELM_NODE_BASE_IMAGE:-${MARKET_HELM_NODE_BASE_IMAGE:-node:22.23.2-alpine}}
        PYTHON_BASE_IMAGE: ${MARKETHELM_PYTHON_BASE_IMAGE:-${MARKET_HELM_PYTHON_BASE_IMAGE:-python:3.12-slim}}
    restart: unless-stopped
    command: ['markethelm', 'alerts', 'run', '--loop']
    healthcheck:
      disable: true
    env_file: ${MARKETHELM_ENV_FILE:-${MARKET_HELM_ENV_FILE:-.env.staging}}
    environment:
      MARKETHELM_DATABASE_URL: postgresql://markethelm:${POSTGRES_PASSWORD}@postgres:5432/markethelm
      DATA_DIR: /var/lib/markethelm/data
    volumes: [market-data:/var/lib/markethelm/data]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
  market-data:
